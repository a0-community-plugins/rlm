name: Plugin checks

"on":
  workflow_dispatch:
    inputs:
      docker_integration:
        description: Run real Docker installer tests with synthetic containers
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Arrange Agent Zero plugin layout
        run: |
          mkdir -p "$RUNNER_TEMP/a0/usr/plugins"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/a0/usr/plugins/rlm"

      - name: Run Python regression tests
        env:
          A0_TEST_PROJECT_ROOT: ${{ runner.temp }}/a0
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ runner.temp }}/a0
        run: python -m unittest discover -s tests -v

      - name: Check dashboard JavaScript syntax
        run: node --check webui/rlm-context-store.js

      - name: Check Docker setup helper syntax
        run: sh -n setup/enable-docker-access.sh

      - name: Check Python syntax
        run: python -m compileall -q .

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Windows launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/setup/enable-docker-access.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Write-Error; exit 1 }

  docker-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.docker_integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Get framework image
        run: docker pull agent0ai/agent-zero:latest
      - name: Test install, rollback, data migration, and repeated setup
        env:
          RLM_DOCKER_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p test_desktop_integration.py -v
